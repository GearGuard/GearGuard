version: '3'

services:
  web:
    image: php:8.0-apache
    volumes:
      - ./:/var/www/html
      - ./apache-config.conf:/etc/apache2/sites-available/000-default.conf
      - ./php-fpm.conf:/etc/apache2/conf-available/php8.0-fpm.conf
    ports:
      - "80:80"
    command: bash -c "a2enmod rewrite && a2enmod proxy_fcgi && a2enconf php8.0-fpm && apache2-foreground"
    depends_on:
      - app

  app:
    image: php:8.0-fpm
    volumes:
      - ./:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mysql:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: myapp
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - ./mysql-data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: rootpassword
    ports:
      - "8080:80"
    depends_on:
      - mysql